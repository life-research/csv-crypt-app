[package]
name = "csv-crypt"
version = "0.1.0"
description = "Desktop app for csv-crypt"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
# Only for the end-to-end test build: opens the CDP port (see src/e2e.rs).
e2e = []

[dev-dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
