name: Release

# Builds and checks the Windows executable. On a version tag, it also creates
# a draft GitHub release; a maintainer reviews and publishes it by hand.
on:
  push:
    tags: ['v*.*.*']
  # Catches a broken Windows build before the release.
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-version.js'
      - 'scripts/check-sbom.js'
      - 'vite.config.ts'
      - '.github/scripts/verify-windows-exe.ps1'
      - '.github/workflows/build-windows.yml'
  # Manual start for any branch ("Run workflow" on the Actions page).
  workflow_dispatch:

# Declare default permissions as read only.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2025
    env:
      # The npm scripts set variables in POSIX syntax (BUILD_TARGET=desktop).
      # Without this, npm runs them in cmd.exe.
      NPM_CONFIG_SCRIPT_SHELL: C:\Program Files\Git\bin\bash.exe
    outputs:
      name: ${{ steps.artifact.outputs.name }}
      subject-b64: ${{ steps.artifact.outputs.subject-b64 }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache: the official executable must not use files from
      # earlier runs (cache poisoning).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # On a tag, the tag must match too. On a pull request or a manual start
      # on a branch, there is no tag.
      - name: Check versions
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version="$(node scripts/check-version.js "${TAG}")"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install dependencies
        run: npm ci

      # Only the executable, no installer.
      - name: Build executable
        run: npx tauri build --no-bundle -- --locked

      - name: Verify executable
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          .github/scripts/verify-windows-exe.ps1
          -Path src-tauri/target/release/csv-crypt.exe
          -Version $env:VERSION
          -ScreenshotPath screenshots/app-start.png

      # Shows what the app looked like on the runner, also when the test failed.
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app-start-screenshot
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Name executable and write checksum
        id: artifact
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Only a tag build has the plain name of an official release.
          # Other builds name the commit they were built from.
          $version = $env:VERSION
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            $version += "-dev.$(git rev-parse --short=7 HEAD)"
          }
          $name = "csv-crypt-$version-windows-x64"
          $exe = "$name.exe"
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item src-tauri/target/release/csv-crypt.exe "dist/$exe"
          $hash = (Get-FileHash "dist/$exe" -Algorithm SHA256).Hash.ToLower()
          # LF line ending, so that `sha256sum -c` also works on Linux.
          $checksumLine = "$hash  $exe`n"
          [IO.File]::WriteAllText("$PWD/dist/$exe.sha256", $checksumLine)
          Write-Host "$exe SHA-256: $hash"
          "name=$name" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          # The SLSA generator takes the sha256sum output, base64 encoded.
          $subject = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($checksumLine))
          "subject-b64=$subject" >> $env:GITHUB_OUTPUT

      - name: Install SBOM tools
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-cyclonedx@0.5.9,cyclonedx@0.33.1

      # One CycloneDX SBOM for the executable: the npm packages in the bundle
      # (rollup-plugin-sbom writes them during the build) and the Cargo crates
      # for Windows, without build-time dependencies.
      - name: Create SBOM
        shell: pwsh
        env:
          NAME: ${{ steps.artifact.outputs.name }}
          VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json `
            --spec-version 1.5 --target x86_64-pc-windows-msvc --no-build-deps `
            --override-filename sbom-cargo
          $productName = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).productName
          $sbom = "dist/$env:NAME.cdx.json"
          cyclonedx merge `
            --input-files build-desktop/cyclonedx/bom.json src-tauri/sbom-cargo.json `
            --output-file $sbom --output-format json --output-version v1_6 `
            --name $productName --version $env:VERSION
          cyclonedx validate --input-file $sbom --input-version v1_6 --fail-on-errors
          node scripts/check-sbom.js $sbom $env:VERSION

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/
          if-no-files-found: error

  # SLSA Build Level 3 provenance for the executable. Sigstore writes the
  # signature to the public Rekor log, which would make the names of a private
  # repository public. So it runs only once the repository is public (1.0).
  provenance:
    needs: [build-windows]
    if: ${{ github.ref_type == 'tag' && !github.event.repository.private }}
    permissions:
      actions: read # to read the workflow run
      contents: write # required by the generator, also without upload
      id-token: write # to sign with Sigstore
    # Must be referenced by tag, not by SHA: slsa-verifier checks this tag.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build-windows.outputs.subject-b64 }}
      upload-assets: false

  # Runs also when provenance was skipped (private repository).
  release:
    needs: [build-windows, provenance]
    if: >-
      ${{ always() && github.ref_type == 'tag' &&
      needs.build-windows.result == 'success' &&
      (needs.provenance.result == 'success' || needs.provenance.result == 'skipped') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write # to create the release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download executable, checksum and SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-windows.outputs.name }}
          path: dist

      - name: Download provenance
        if: ${{ needs.provenance.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist

      # A draft is visible only to maintainers until they publish it.
      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
